<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Weiterleitung</title>

  <script>
    const path = window.location.pathname.replace(/\/+$/, "");

    const redirects = {
      "/info": "https://www.holzhandwerk-moeck-gmbh.de/?utm_source=email&utm_medium=kaltakquise&utm_campaign=holzhandwerk_info",
      "/vertrieb/info": "https://www.holzhandwerk-moeck-gmbh.de/vertrieb/?utm_source=email&utm_medium=kaltakquise&utm_campaign=vertrieb_info",
      "/agrima": "https://www.agrima-maier.de/?utm_source=email&utm_medium=kaltakquise&utm_campaign=agrima_info"
    };

    if (redirects[path]) {
      window.location.replace(redirects[path]);
    } else {
      window.location.replace("https://www.holzhandwerk-moeck-gmbh.de/");
    }
  </script>
</head>
<body>
  <p>Sie werden weitergeleitet...</p>
</body>
</html>
